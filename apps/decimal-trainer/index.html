<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小数計算トレーナー | わかる！できた！算数学習サイト</title>
    <meta name="description" content="位取りを理解して小数をマスター！買い物や距離など、実生活で使える小数計算を学ぼう。">
    <style>
        /* ===== デザインシステムから必要な変数を定義 ===== */
        :root {
            /* カラー */
            --primary-500: #4A90E2;
            --primary-400: #5CA3EF;
            --primary-600: #3A7BCF;
            --secondary-500: #7ED321;
            --secondary-400: #96E03A;
            --accent-orange-500: #F5A623;
            --accent-orange-400: #FFB84D;
            --accent-purple-500: #9C27B0;
            --success-500: #7ED321;
            --error-500: #FF6B6B;
            --warning-500: #F5A623;
            --gray-900: #2C3E50;
            --gray-800: #34495E;
            --gray-700: #546E7A;
            --gray-600: #607D8B;
            --gray-300: #CFD8DC;
            --gray-200: #ECEFF1;
            --gray-100: #F5F7F8;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8F9FA;

            /* フォント */
            --font-body: 'UD Digi Kyokasho NK-R', 'UD Digi Kyokasho N-R', '游ゴシック体', 'Yu Gothic', YuGothic, 'メイリオ', Meiryo, sans-serif;
            --font-heading: 'UD Digi Kyokasho NK-B', 'UD Digi Kyokasho N-B', '游ゴシック体', 'Yu Gothic', YuGothic, 'メイリオ', Meiryo, sans-serif;
            --font-number: 'Poppins', 'Roboto', 'SF Pro', -apple-system, BlinkMacSystemFont, sans-serif;

            /* スペーシング */
            --spacing-2: 0.5rem;
            --spacing-3: 0.75rem;
            --spacing-4: 1rem;
            --spacing-5: 1.5rem;
            --spacing-6: 2rem;

            /* ボーダー */
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;

            /* シャドウ */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 15px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.15);

            /* トランジション */
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
        }

        /* ===== リセット ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #E3F2FD 0%, #F3E5F5 50%, #FFF3E0 100%);
            min-height: 100vh;
            padding: var(--spacing-4);
            color: var(--gray-900);
        }

        /* ===== コンテナ ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== ヘッダー ===== */
        header {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8F9FA 100%);
            padding: var(--spacing-5);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            margin-bottom: var(--spacing-5);
            text-align: center;
        }

        h1 {
            font-family: var(--font-heading);
            color: var(--primary-600);
            font-size: 2rem;
            margin-bottom: var(--spacing-3);
        }

        .subtitle {
            color: var(--gray-700);
            font-size: 1.125rem;
        }

        /* ===== モード選択 ===== */
        .mode-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-5);
        }

        .mode-btn {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8F9FA 100%);
            border: 3px solid var(--gray-300);
            border-radius: var(--radius-lg);
            padding: var(--spacing-5);
            cursor: pointer;
            transition: all var(--transition-normal);
            text-align: center;
            box-shadow: var(--shadow-sm);
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .mode-btn:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-500);
        }

        .mode-btn.active {
            border-color: var(--primary-500);
            background: linear-gradient(135deg, #E3F2FD 0%, #FFFFFF 100%);
            box-shadow: var(--shadow-md);
        }

        .mode-icon {
            font-size: 3rem;
            margin-bottom: var(--spacing-3);
        }

        .mode-title {
            font-family: var(--font-heading);
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        /* ===== ゲームエリア ===== */
        .game-area {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8F9FA 100%);
            border-radius: var(--radius-xl);
            padding: var(--spacing-6);
            box-shadow: var(--shadow-lg);
            margin-bottom: var(--spacing-5);
        }

        .hidden {
            display: none;
        }

        /* ===== スコアボード ===== */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-5);
            padding: var(--spacing-4);
            background: linear-gradient(90deg, #E3F2FD, #F3E5F5);
            border-radius: var(--radius-lg);
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.875rem;
            color: var(--gray-700);
            margin-bottom: var(--spacing-2);
        }

        .score-value {
            font-family: var(--font-number);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-600);
        }

        /* ===== 位取り表 ===== */
        .place-value-table {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: var(--spacing-5);
            justify-items: center;
        }

        .place-column {
            text-align: center;
            width: 100%;
        }

        .place-header {
            background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
            color: white;
            padding: var(--spacing-3);
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.875rem;
            margin-bottom: 8px;
            box-shadow: var(--shadow-sm);
        }

        .place-cell {
            background: white;
            border: 3px solid var(--gray-300);
            border-radius: var(--radius-md);
            padding: var(--spacing-4);
            font-family: var(--font-number);
            font-size: 2rem;
            font-weight: 700;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-normal);
        }

        .place-cell.highlight {
            background: linear-gradient(135deg, #FFF3E0, #FFE0B2);
            border-color: var(--accent-orange-500);
            animation: pulse 1s ease-in-out infinite;
        }

        .place-cell.decimal-point {
            font-size: 3rem;
            color: var(--error-500);
        }

        /* 色分け */
        .place-column:nth-child(1) .place-header { background: linear-gradient(135deg, #E91E63, #C2185B); }
        .place-column:nth-child(2) .place-header { background: linear-gradient(135deg, #9C27B0, #7B1FA2); }
        .place-column:nth-child(3) .place-header { background: linear-gradient(135deg, #3F51B5, #303F9F); }
        .place-column:nth-child(4) .place-header { background: linear-gradient(135deg, #F44336, #D32F2F); }
        .place-column:nth-child(5) .place-header { background: linear-gradient(135deg, #4CAF50, #388E3C); }
        .place-column:nth-child(6) .place-header { background: linear-gradient(135deg, #FF9800, #F57C00); }
        .place-column:nth-child(7) .place-header { background: linear-gradient(135deg, #00BCD4, #0097A7); }

        /* ===== 問題表示 ===== */
        .problem-display {
            text-align: center;
            margin-bottom: var(--spacing-5);
        }

        .problem-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: var(--spacing-4);
            line-height: 1.6;
            padding: var(--spacing-4);
            background: linear-gradient(135deg, #FFF3E0, #FFFFFF);
            border-radius: var(--radius-lg);
            border: 2px solid var(--accent-orange-400);
        }

        .calculation-display {
            font-family: var(--font-number);
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary-600);
            margin: var(--spacing-5) 0;
            padding: var(--spacing-5);
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .operator {
            color: var(--accent-orange-500);
            font-size: 3.5rem;
            margin: 0 var(--spacing-3);
        }

        .equals {
            color: var(--gray-700);
            font-size: 3.5rem;
            margin: 0 var(--spacing-3);
        }

        /* ===== 筆算表示 ===== */
        .vertical-calculation {
            font-family: var(--font-number);
            background: white;
            padding: var(--spacing-6);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin: var(--spacing-5) auto;
            max-width: 400px;
        }

        .vertical-number {
            text-align: right;
            font-size: 2.5rem;
            font-weight: 700;
            padding: var(--spacing-3);
            letter-spacing: 0.5rem;
        }

        .vertical-line {
            border-top: 4px solid var(--gray-900);
            margin: var(--spacing-3) 0;
        }

        .vertical-operator {
            position: absolute;
            left: 20px;
            font-size: 2.5rem;
            color: var(--accent-orange-500);
        }

        /* ===== 入力エリア ===== */
        .input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-5);
        }

        .answer-input {
            font-family: var(--font-number);
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            padding: var(--spacing-4);
            border: 3px solid var(--gray-300);
            border-radius: var(--radius-lg);
            width: 300px;
            max-width: 100%;
            transition: all var(--transition-normal);
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.2);
        }

        .answer-input.correct {
            border-color: var(--success-500);
            background: linear-gradient(135deg, #F1F8E9, #FFFFFF);
        }

        .answer-input.incorrect {
            border-color: var(--error-500);
            animation: shake 0.5s ease;
        }

        /* ===== 数字パッド ===== */
        .number-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-3);
            max-width: 300px;
            margin: 0 auto;
        }

        .num-btn {
            background: linear-gradient(135deg, #FFFFFF, #F8F9FA);
            border: 2px solid var(--gray-300);
            border-radius: var(--radius-lg);
            padding: var(--spacing-4);
            font-family: var(--font-number);
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .num-btn:hover {
            background: linear-gradient(135deg, #E3F2FD, #FFFFFF);
            border-color: var(--primary-500);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .num-btn:active {
            transform: translateY(0);
        }

        .num-btn.special {
            background: linear-gradient(90deg, var(--accent-orange-400), var(--accent-orange-500));
            color: white;
            border: none;
        }

        /* ===== ボタン ===== */
        .btn-group {
            display: flex;
            gap: var(--spacing-4);
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            font-family: var(--font-body);
            font-size: 1.125rem;
            font-weight: 700;
            padding: var(--spacing-4) var(--spacing-6);
            border: none;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
            min-width: 150px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #66bb6a 0%, #4caf50 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(90deg, #4A90E2, #3A7BCF);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(74, 144, 226, 0.4);
        }

        .btn-warning {
            background: linear-gradient(90deg, #ff9800, #f57c00);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(245, 166, 35, 0.4);
        }

        .btn:disabled {
            background: linear-gradient(90deg, #B0BEC5, #CFD8DC);
            cursor: not-allowed;
            transform: none;
        }

        /* ===== フィードバック ===== */
        .feedback {
            text-align: center;
            padding: var(--spacing-4);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-5);
            font-size: 1.25rem;
            font-weight: 700;
            animation: slideDown 0.3s ease;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #C8E6C9, #F1F8E9);
            color: #2E7D32;
            border: 3px solid var(--success-500);
        }

        .feedback.incorrect {
            background: linear-gradient(135deg, #FFCDD2, #FFEBEE);
            color: #D32F2F;
            border: 3px solid var(--error-500);
        }

        /* ===== 選択肢 ===== */
        .choices {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-4);
            margin: var(--spacing-5) 0;
        }

        .choice-btn {
            background: linear-gradient(135deg, #FFFFFF, #F8F9FA);
            border: 3px solid var(--gray-300);
            border-radius: var(--radius-lg);
            padding: var(--spacing-5);
            font-family: var(--font-number);
            font-size: 1.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, #E3F2FD, #FFFFFF);
            border-color: var(--primary-500);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .choice-btn.correct {
            background: linear-gradient(135deg, #C8E6C9, #F1F8E9);
            border-color: var(--success-500);
        }

        .choice-btn.incorrect {
            background: linear-gradient(135deg, #FFCDD2, #FFEBEE);
            border-color: var(--error-500);
            animation: shake 0.5s ease;
        }

        /* ===== ヒント ===== */
        .hint-box {
            background: linear-gradient(135deg, #FFF3E0, #FFFFFF);
            border: 2px solid var(--warning-500);
            border-radius: var(--radius-lg);
            padding: var(--spacing-4);
            margin: var(--spacing-4) 0;
            font-size: 1.125rem;
            line-height: 1.6;
        }

        .hint-title {
            font-weight: 700;
            color: var(--warning-500);
            margin-bottom: var(--spacing-2);
            font-size: 1.25rem;
        }

        /* ===== アニメーション ===== */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes confetti-fall {
            0% {
                opacity: 1;
                transform: translateY(-100vh) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 1000;
            pointer-events: none;
        }

        /* ===== レスポンシブ ===== */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .mode-selection {
                grid-template-columns: 1fr;
            }

            .place-value-table {
                grid-template-columns: repeat(3, 1fr);
                gap: 4px;
            }

            .place-header {
                font-size: 0.75rem;
                padding: var(--spacing-2);
            }

            .place-cell {
                font-size: 1.5rem;
                padding: var(--spacing-3);
                min-height: 60px;
            }

            .calculation-display {
                font-size: 2rem;
            }

            .answer-input {
                width: 100%;
                font-size: 1.5rem;
            }

            .btn {
                min-width: 120px;
                font-size: 1rem;
            }
        }

        /* ===== アクセシビリティ ===== */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        button:focus, .mode-btn:focus, .choice-btn:focus, .num-btn:focus {
            outline: 3px solid var(--primary-500);
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <header>
            <h1>🔢 小数計算トレーナー</h1>
            <p class="subtitle">位取りを理解して小数をマスター！</p>
        </header>

        <!-- スコアボード -->
        <div class="scoreboard">
            <div class="score-item">
                <div class="score-label">正解数</div>
                <div class="score-value" id="correct-count">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">問題数</div>
                <div class="score-value" id="total-count">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">正答率</div>
                <div class="score-value" id="accuracy">0%</div>
            </div>
        </div>

        <!-- モード選択 -->
        <div class="mode-selection" id="mode-selection">
            <button class="mode-btn" data-mode="place-value" aria-label="位取り学習モードを選択">
                <div class="mode-icon">📊</div>
                <div class="mode-title">位取り学習</div>
            </button>
            <button class="mode-btn" data-mode="add-subtract" aria-label="足し算引き算モードを選択">
                <div class="mode-icon">➕➖</div>
                <div class="mode-title">足し算・引き算</div>
            </button>
            <button class="mode-btn" data-mode="multiply-divide" aria-label="かけ算わり算モードを選択">
                <div class="mode-icon">✖️➗</div>
                <div class="mode-title">かけ算・わり算</div>
            </button>
            <button class="mode-btn" data-mode="rounding" aria-label="およその数モードを選択">
                <div class="mode-icon">🔄</div>
                <div class="mode-title">およその数</div>
            </button>
            <button class="mode-btn" data-mode="real-life" aria-label="実生活問題モードを選択">
                <div class="mode-icon">🛒</div>
                <div class="mode-title">実生活問題</div>
            </button>
        </div>

        <!-- ゲームエリア -->
        <div class="game-area hidden" id="game-area">
            <div id="feedback-area"></div>
            <div id="problem-area"></div>
            <div class="btn-group">
                <button class="btn btn-warning" id="hint-btn">💡 ヒント</button>
                <button class="btn btn-secondary" id="next-btn" style="display: none;">次の問題</button>
                <button class="btn btn-primary" id="back-btn">← モード選択に戻る</button>
            </div>
        </div>
    </div>

    <script>
        // ===== グローバル変数 =====
        let currentMode = null;
        let currentProblem = null;
        let correctCount = 0;
        let totalCount = 0;

        // ===== DOM要素 =====
        const modeSelection = document.getElementById('mode-selection');
        const gameArea = document.getElementById('game-area');
        const problemArea = document.getElementById('problem-area');
        const feedbackArea = document.getElementById('feedback-area');
        const correctCountEl = document.getElementById('correct-count');
        const totalCountEl = document.getElementById('total-count');
        const accuracyEl = document.getElementById('accuracy');
        const hintBtn = document.getElementById('hint-btn');
        const nextBtn = document.getElementById('next-btn');
        const backBtn = document.getElementById('back-btn');

        // ===== モード選択 =====
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentMode = btn.dataset.mode;
                startMode(currentMode);
            });
        });

        // ===== モード開始 =====
        function startMode(mode) {
            modeSelection.classList.add('hidden');
            gameArea.classList.remove('hidden');
            nextBtn.style.display = 'none';
            generateProblem(mode);
        }

        // ===== 問題生成 =====
        function generateProblem(mode) {
            feedbackArea.innerHTML = '';

            switch(mode) {
                case 'place-value':
                    generatePlaceValueProblem();
                    break;
                case 'add-subtract':
                    generateAddSubtractProblem();
                    break;
                case 'multiply-divide':
                    generateMultiplyDivideProblem();
                    break;
                case 'rounding':
                    generateRoundingProblem();
                    break;
                case 'real-life':
                    generateRealLifeProblem();
                    break;
            }
        }

        // ===== 位取り学習モード =====
        function generatePlaceValueProblem() {
            const number = (Math.random() * 999 + 1).toFixed(3);
            const digits = number.split('');
            const dotIndex = digits.indexOf('.');

            // ランダムに位置を選択
            const positions = ['百', '十', '一', '小数第一位', '小数第二位', '小数第三位'];
            const targetIndex = Math.floor(Math.random() * 6);
            const targetPos = positions[targetIndex];

            let actualIndex = targetIndex;
            if (targetIndex >= 3) actualIndex = targetIndex + 1; // 小数点を考慮

            const answer = digits[actualIndex] || '0';

            currentProblem = {
                number: number,
                targetPos: targetPos,
                answer: answer
            };

            problemArea.innerHTML = `
                <div class="problem-display">
                    <h2>この数の<span style="color: var(--accent-orange-500);">${targetPos}</span>の数字は？</h2>
                    <div class="calculation-display">${number}</div>
                </div>
                ${createPlaceValueTable(number, targetIndex)}
                <div class="choices">
                    ${generateDigitChoices(answer)}
                </div>
                <div class="hint-box hidden" id="hint">
                    <div class="hint-title">💡 ヒント</div>
                    小数点の位置に注目！<br>
                    小数点より左が「一の位、十の位、百の位」<br>
                    小数点より右が「小数第一位、小数第二位、小数第三位」だよ！
                </div>
            `;
        }

        // ===== 位取り表作成 =====
        function createPlaceValueTable(number, highlightIndex) {
            const places = ['百', '十', '一', '.', '1/10', '1/100', '1/1000'];
            const digits = number.split('');

            let html = '<div class="place-value-table">';

            places.forEach((place, index) => {
                const isDecimalPoint = place === '.';
                const digitIndex = index > 3 ? index - 1 : index;
                const digit = digits[digitIndex] || '0';
                const shouldHighlight = index === (highlightIndex >= 3 ? highlightIndex + 1 : highlightIndex);

                html += `
                    <div class="place-column">
                        <div class="place-header">${place}</div>
                        <div class="place-cell ${shouldHighlight ? 'highlight' : ''} ${isDecimalPoint ? 'decimal-point' : ''}">
                            ${isDecimalPoint ? '.' : digit}
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            return html;
        }

        // ===== 数字選択肢生成 =====
        function generateDigitChoices(correctAnswer) {
            const choices = new Set([correctAnswer]);
            while (choices.size < 4) {
                choices.add(String(Math.floor(Math.random() * 10)));
            }

            return Array.from(choices).sort(() => Math.random() - 0.5).map(choice => {
                return `<button class="choice-btn" data-answer="${choice}">${choice}</button>`;
            }).join('');
        }

        // ===== 足し算・引き算モード =====
        function generateAddSubtractProblem() {
            const isAddition = Math.random() > 0.5;
            const num1 = (Math.random() * 99 + 1).toFixed(2);
            const num2 = (Math.random() * 99 + 1).toFixed(2);

            let answer;
            let operator;

            if (isAddition) {
                answer = (parseFloat(num1) + parseFloat(num2)).toFixed(2);
                operator = '+';
            } else {
                if (parseFloat(num1) < parseFloat(num2)) {
                    [num1, num2] = [num2, num1];
                }
                answer = (parseFloat(num1) - parseFloat(num2)).toFixed(2);
                operator = '-';
            }

            currentProblem = {
                num1: num1,
                num2: num2,
                operator: operator,
                answer: answer
            };

            problemArea.innerHTML = `
                <div class="problem-display">
                    <h2>計算しよう！</h2>
                    <div class="vertical-calculation" style="position: relative;">
                        <div class="vertical-operator">${operator}</div>
                        <div class="vertical-number">${num1}</div>
                        <div class="vertical-number">${num2}</div>
                        <div class="vertical-line"></div>
                        <div class="vertical-number" style="color: var(--primary-600);">?</div>
                    </div>
                </div>
                <div class="input-area">
                    <input type="text" class="answer-input" id="answer-input"
                           placeholder="答えを入力" inputmode="decimal"
                           aria-label="答えを入力してください">
                    ${createNumberPad()}
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="submit-btn">答え合わせ</button>
                </div>
                <div class="hint-box hidden" id="hint">
                    <div class="hint-title">💡 ヒント</div>
                    小数点の位置を揃えて計算しよう！<br>
                    一の位、小数第一位、小数第二位を縦に揃えてね。<br>
                    ${isAddition ? '足し算は、それぞれの位ごとに足していくよ。' : '引き算は、それぞれの位ごとに引いていくよ。'}
                </div>
            `;

            setupNumberPadEvents();
            document.getElementById('submit-btn').addEventListener('click', () => checkDecimalAnswer(answer));
        }

        // ===== かけ算・わり算モード =====
        function generateMultiplyDivideProblem() {
            const isMultiplication = Math.random() > 0.5;

            if (isMultiplication) {
                const num1 = (Math.random() * 9 + 1).toFixed(1);
                const num2 = Math.floor(Math.random() * 9 + 1);
                const answer = (parseFloat(num1) * num2).toFixed(2);

                currentProblem = { num1, num2, operator: '×', answer };

                problemArea.innerHTML = `
                    <div class="problem-display">
                        <h2>計算しよう！</h2>
                        <div class="calculation-display">
                            <span>${num1}</span>
                            <span class="operator">×</span>
                            <span>${num2}</span>
                            <span class="equals">=</span>
                            <span style="color: var(--primary-600);">?</span>
                        </div>
                    </div>
                    <div class="input-area">
                        <input type="text" class="answer-input" id="answer-input"
                               placeholder="答えを入力" inputmode="decimal"
                               aria-label="答えを入力してください">
                        ${createNumberPad()}
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="submit-btn">答え合わせ</button>
                    </div>
                    <div class="hint-box hidden" id="hint">
                        <div class="hint-title">💡 ヒント</div>
                        小数点を無視して計算してから、最後に小数点を戻すよ！<br>
                        ${num1} × ${num2} = ${parseFloat(num1) * 10} × ${num2} ÷ 10<br>
                        小数第一位が1つあるから、答えも小数第一位になるよ。
                    </div>
                `;
            } else {
                const answer = (Math.random() * 9 + 1).toFixed(1);
                const num2 = Math.floor(Math.random() * 9 + 1);
                const num1 = (parseFloat(answer) * num2).toFixed(2);

                currentProblem = { num1, num2, operator: '÷', answer: parseFloat(answer).toFixed(1) };

                problemArea.innerHTML = `
                    <div class="problem-display">
                        <h2>計算しよう！</h2>
                        <div class="calculation-display">
                            <span>${num1}</span>
                            <span class="operator">÷</span>
                            <span>${num2}</span>
                            <span class="equals">=</span>
                            <span style="color: var(--primary-600);">?</span>
                        </div>
                    </div>
                    <div class="input-area">
                        <input type="text" class="answer-input" id="answer-input"
                               placeholder="答えを入力" inputmode="decimal"
                               aria-label="答えを入力してください">
                        ${createNumberPad()}
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="submit-btn">答え合わせ</button>
                    </div>
                    <div class="hint-box hidden" id="hint">
                        <div class="hint-title">💡 ヒント</div>
                        わる数とわられる数に同じ数をかけても答えは変わらないよ！<br>
                        ${num1} ÷ ${num2} = ${parseFloat(num1) * 10} ÷ ${num2 * 10}<br>
                        小数点を右に1つ移動させてから計算してみよう。
                    </div>
                `;
            }

            setupNumberPadEvents();
            document.getElementById('submit-btn').addEventListener('click', () => checkDecimalAnswer(currentProblem.answer));
        }

        // ===== およその数モード =====
        function generateRoundingProblem() {
            const number = (Math.random() * 999 + 1).toFixed(2);
            const types = [
                { name: '四捨五入', method: 'round' },
                { name: '切り上げ', method: 'ceil' },
                { name: '切り捨て', method: 'floor' }
            ];
            const type = types[Math.floor(Math.random() * types.length)];

            const places = [
                { name: '一の位', power: 0 },
                { name: '十の位', power: 1 },
                { name: '小数第一位', power: -1 }
            ];
            const place = places[Math.floor(Math.random() * places.length)];

            let answer;
            const num = parseFloat(number);
            const factor = Math.pow(10, place.power);

            if (type.method === 'round') {
                answer = Math.round(num / factor) * factor;
            } else if (type.method === 'ceil') {
                answer = Math.ceil(num / factor) * factor;
            } else {
                answer = Math.floor(num / factor) * factor;
            }

            answer = place.power < 0 ? answer.toFixed(1) : answer.toFixed(0);

            currentProblem = { number, type: type.name, place: place.name, answer };

            problemArea.innerHTML = `
                <div class="problem-display">
                    <div class="problem-text">
                        ${number} を ${place.name} で ${type.name} すると？
                    </div>
                    <div class="calculation-display">${number}</div>
                </div>
                <div class="input-area">
                    <input type="text" class="answer-input" id="answer-input"
                           placeholder="答えを入力" inputmode="decimal"
                           aria-label="答えを入力してください">
                    ${createNumberPad()}
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="submit-btn">答え合わせ</button>
                </div>
                <div class="hint-box hidden" id="hint">
                    <div class="hint-title">💡 ヒント</div>
                    <strong>${type.name}の方法：</strong><br>
                    ${getRoundingHint(type.method, place.name)}<br>
                    ${place.name}の数字に注目してね！
                </div>
            `;

            setupNumberPadEvents();
            document.getElementById('submit-btn').addEventListener('click', () => checkDecimalAnswer(answer));
        }

        // ===== 丸め方のヒント =====
        function getRoundingHint(method, place) {
            if (method === 'round') {
                return `${place}の次の位を見て、5以上なら切り上げ、4以下なら切り捨て`;
            } else if (method === 'ceil') {
                return `${place}の次の位に数字があれば、必ず切り上げ`;
            } else {
                return `${place}の次の位は全て捨てる`;
            }
        }

        // ===== 実生活問題モード =====
        function generateRealLifeProblem() {
            const scenarios = [
                {
                    type: 'shopping',
                    generate: () => {
                        const item1Price = (Math.random() * 500 + 100).toFixed(0);
                        const item2Price = (Math.random() * 300 + 50).toFixed(0);
                        const answer = (parseFloat(item1Price) + parseFloat(item2Price)).toFixed(0);
                        return {
                            text: `りんごが${item1Price}円、みかんが${item2Price}円です。2つ買うと全部でいくら？`,
                            answer: answer,
                            unit: '円'
                        };
                    }
                },
                {
                    type: 'distance',
                    generate: () => {
                        const distance1 = (Math.random() * 5 + 0.5).toFixed(1);
                        const distance2 = (Math.random() * 3 + 0.5).toFixed(1);
                        const answer = (parseFloat(distance1) + parseFloat(distance2)).toFixed(1);
                        return {
                            text: `家から学校まで${distance1}km、学校から公園まで${distance2}kmです。家から公園まで学校を通って行くと何km？`,
                            answer: answer,
                            unit: 'km'
                        };
                    }
                },
                {
                    type: 'weight',
                    generate: () => {
                        const weight = (Math.random() * 5 + 1).toFixed(2);
                        const pieces = Math.floor(Math.random() * 4 + 2);
                        const answer = (parseFloat(weight) / pieces).toFixed(2);
                        return {
                            text: `${weight}kgのケーキを${pieces}人で同じ量ずつ分けます。1人分は何kg？`,
                            answer: answer,
                            unit: 'kg'
                        };
                    }
                },
                {
                    type: 'time',
                    generate: () => {
                        const distance = (Math.random() * 10 + 5).toFixed(1);
                        const speed = (Math.random() * 3 + 2).toFixed(1);
                        const answer = (parseFloat(distance) / parseFloat(speed)).toFixed(2);
                        return {
                            text: `${distance}kmの道のりを時速${speed}kmで歩きます。何時間かかる？`,
                            answer: answer,
                            unit: '時間'
                        };
                    }
                }
            ];

            const scenario = scenarios[Math.floor(Math.random() * scenarios.length)];
            const problem = scenario.generate();

            currentProblem = {
                text: problem.text,
                answer: problem.answer,
                unit: problem.unit
            };

            problemArea.innerHTML = `
                <div class="problem-display">
                    <div class="problem-text">${problem.text}</div>
                </div>
                <div class="input-area">
                    <input type="text" class="answer-input" id="answer-input"
                           placeholder="答えを入力" inputmode="decimal"
                           aria-label="答えを入力してください">
                    <div style="font-size: 1.5rem; font-weight: 700; color: var(--gray-700);">${problem.unit}</div>
                    ${createNumberPad()}
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="submit-btn">答え合わせ</button>
                </div>
                <div class="hint-box hidden" id="hint">
                    <div class="hint-title">💡 ヒント</div>
                    問題文をよく読んで、どんな計算が必要か考えよう！<br>
                    • 「合わせて」「全部で」→ 足し算<br>
                    • 「残り」「違い」→ 引き算<br>
                    • 「〜ずつ」「〜倍」→ かけ算<br>
                    • 「分ける」「1つ分」→ わり算
                </div>
            `;

            setupNumberPadEvents();
            document.getElementById('submit-btn').addEventListener('click', () => checkDecimalAnswer(problem.answer));
        }

        // ===== 数字パッド作成 =====
        function createNumberPad() {
            return `
                <div class="number-pad">
                    <button class="num-btn" data-num="7">7</button>
                    <button class="num-btn" data-num="8">8</button>
                    <button class="num-btn" data-num="9">9</button>
                    <button class="num-btn" data-num="4">4</button>
                    <button class="num-btn" data-num="5">5</button>
                    <button class="num-btn" data-num="6">6</button>
                    <button class="num-btn" data-num="1">1</button>
                    <button class="num-btn" data-num="2">2</button>
                    <button class="num-btn" data-num="3">3</button>
                    <button class="num-btn" data-num=".">.</button>
                    <button class="num-btn" data-num="0">0</button>
                    <button class="num-btn special" data-num="clear">消去</button>
                </div>
            `;
        }

        // ===== 数字パッドイベント設定 =====
        function setupNumberPadEvents() {
            const input = document.getElementById('answer-input');

            document.querySelectorAll('.num-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const num = btn.dataset.num;

                    if (num === 'clear') {
                        input.value = '';
                    } else {
                        input.value += num;
                    }

                    input.focus();
                });
            });

            // Enterキーで答え合わせ
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const submitBtn = document.getElementById('submit-btn');
                    if (submitBtn) submitBtn.click();
                }
            });
        }

        // ===== 選択肢イベント設定 =====
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('choice-btn')) {
                const userAnswer = e.target.dataset.answer;
                checkAnswer(userAnswer, currentProblem.answer, e.target);
            }
        });

        // ===== 小数入力答え合わせ =====
        function checkDecimalAnswer(correctAnswer) {
            const input = document.getElementById('answer-input');
            const userAnswer = input.value.trim();

            const correct = parseFloat(userAnswer) === parseFloat(correctAnswer);

            if (correct) {
                input.classList.add('correct');
                showFeedback(true, `正解！答えは ${correctAnswer} だよ！`);
                createConfetti();
                correctCount++;
            } else {
                input.classList.add('incorrect');
                showFeedback(false, `残念...正解は ${correctAnswer} だよ。もう一度挑戦してみよう！`);
            }

            totalCount++;
            updateScore();

            const submitBtn = document.getElementById('submit-btn');
            if (submitBtn) submitBtn.disabled = true;

            nextBtn.style.display = 'block';
        }

        // ===== 答え合わせ =====
        function checkAnswer(userAnswer, correctAnswer, button) {
            const correct = userAnswer === correctAnswer;

            if (correct) {
                button.classList.add('correct');
                showFeedback(true, '正解！よくできました！');
                createConfetti();
                correctCount++;
            } else {
                button.classList.add('incorrect');
                showFeedback(false, `残念...正解は ${correctAnswer} だよ。`);
            }

            totalCount++;
            updateScore();

            // 全ての選択肢を無効化
            document.querySelectorAll('.choice-btn').forEach(btn => {
                btn.disabled = true;
                btn.style.cursor = 'not-allowed';
                if (btn.dataset.answer === correctAnswer) {
                    btn.classList.add('correct');
                }
            });

            nextBtn.style.display = 'block';
        }

        // ===== フィードバック表示 =====
        function showFeedback(isCorrect, message) {
            feedbackArea.innerHTML = `
                <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                    ${isCorrect ? '🎉' : '😅'} ${message}
                </div>
            `;
        }

        // ===== スコア更新 =====
        function updateScore() {
            correctCountEl.textContent = correctCount;
            totalCountEl.textContent = totalCount;
            const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
            accuracyEl.textContent = accuracy + '%';
        }

        // ===== 紙吹雪アニメーション =====
        function createConfetti() {
            const colors = ['#FFD54F', '#FF9800', '#4CAF50', '#4A90E2', '#E91E63', '#9C27B0'];

            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animation = `confetti-fall ${2 + Math.random() * 2}s ease-out`;
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 4000);
                }, i * 50);
            }
        }

        // ===== ヒントボタン =====
        hintBtn.addEventListener('click', () => {
            const hint = document.getElementById('hint');
            if (hint) {
                hint.classList.toggle('hidden');
                hintBtn.textContent = hint.classList.contains('hidden') ? '💡 ヒント' : '💡 ヒントを隠す';
            }
        });

        // ===== 次の問題ボタン =====
        nextBtn.addEventListener('click', () => {
            generateProblem(currentMode);
            nextBtn.style.display = 'none';
            hintBtn.textContent = '💡 ヒント';
        });

        // ===== モード選択に戻る =====
        backBtn.addEventListener('click', () => {
            gameArea.classList.add('hidden');
            modeSelection.classList.remove('hidden');
            currentMode = null;
            problemArea.innerHTML = '';
            feedbackArea.innerHTML = '';
        });

        // ===== 初期化 =====
        updateScore();
    </script>
</body>
</html>
