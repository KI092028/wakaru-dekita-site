<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>割合チャレンジ | わかる！できた！算数学習サイト</title>
    <meta name="description" content="5年生の最難関！割合をマスターしよう。セールや税金など、実生活で使える割合を段階的に学べるよ。">
    <style>
        /* ===== デザインシステムから必要な変数を定義 ===== */
        :root {
            /* カラー */
            --primary-500: #4A90E2;
            --primary-400: #5CA3EF;
            --primary-600: #3A7BCF;
            --secondary-500: #7ED321;
            --secondary-400: #96E03A;
            --accent-orange-500: #F5A623;
            --accent-orange-400: #FFB84D;
            --accent-purple-500: #9C27B0;
            --accent-purple-400: #BA68C8;
            --success-500: #7ED321;
            --error-500: #FF6B6B;
            --warning-500: #F5A623;
            --gray-900: #2C3E50;
            --gray-800: #34495E;
            --gray-700: #546E7A;
            --gray-600: #607D8B;
            --gray-300: #CFD8DC;
            --gray-200: #ECEFF1;
            --gray-100: #F5F7F8;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8F9FA;

            /* フォント */
            --font-body: 'UD Digi Kyokasho NK-R', 'UD Digi Kyokasho N-R', '游ゴシック体', 'Yu Gothic', YuGothic, 'メイリオ', Meiryo, sans-serif;
            --font-heading: 'UD Digi Kyokasho NK-B', 'UD Digi Kyokasho N-B', '游ゴシック体', 'Yu Gothic', YuGothic, 'メイリオ', Meiryo, sans-serif;
            --font-number: 'Poppins', 'Roboto', 'SF Pro', -apple-system, BlinkMacSystemFont, sans-serif;

            /* スペーシング */
            --spacing-2: 0.5rem;
            --spacing-3: 0.75rem;
            --spacing-4: 1rem;
            --spacing-5: 1.5rem;
            --spacing-6: 2rem;

            /* ボーダー */
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;

            /* シャドウ */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 15px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.15);

            /* トランジション */
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
        }

        /* ===== リセット ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #E3F2FD 0%, #F3E5F5 50%, #FFF3E0 100%);
            min-height: 100vh;
            padding: var(--spacing-4);
            color: var(--gray-900);
        }

        /* ===== コンテナ ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== ヘッダー ===== */
        header {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8F9FA 100%);
            padding: var(--spacing-5);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            margin-bottom: var(--spacing-5);
            text-align: center;
        }

        h1 {
            font-family: var(--font-heading);
            color: var(--accent-purple-500);
            font-size: 2rem;
            margin-bottom: var(--spacing-3);
        }

        .subtitle {
            color: var(--gray-700);
            font-size: 1.125rem;
        }

        /* ===== モード選択 ===== */
        .mode-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-5);
        }

        .mode-btn {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8F9FA 100%);
            border: 3px solid var(--gray-300);
            border-radius: var(--radius-lg);
            padding: var(--spacing-5);
            cursor: pointer;
            transition: all var(--transition-normal);
            text-align: center;
            box-shadow: var(--shadow-sm);
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .mode-btn:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-purple-500);
        }

        .mode-btn.active {
            border-color: var(--accent-purple-500);
            background: linear-gradient(135deg, #F3E5F5 0%, #FFFFFF 100%);
            box-shadow: var(--shadow-md);
        }

        .mode-icon {
            font-size: 3rem;
            margin-bottom: var(--spacing-3);
        }

        .mode-title {
            font-family: var(--font-heading);
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .mode-desc {
            font-size: 0.875rem;
            color: var(--gray-600);
            margin-top: var(--spacing-2);
        }

        /* ===== ゲームエリア ===== */
        .game-area {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8F9FA 100%);
            border-radius: var(--radius-xl);
            padding: var(--spacing-6);
            box-shadow: var(--shadow-lg);
            margin-bottom: var(--spacing-5);
        }

        .hidden {
            display: none;
        }

        /* ===== スコアボード ===== */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-5);
            padding: var(--spacing-4);
            background: linear-gradient(90deg, #F3E5F5, #E3F2FD);
            border-radius: var(--radius-lg);
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.875rem;
            color: var(--gray-700);
            margin-bottom: var(--spacing-2);
        }

        .score-value {
            font-family: var(--font-number);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent-purple-500);
        }

        /* ===== く・も・わ図 ===== */
        .kumowa-diagram {
            max-width: 400px;
            margin: var(--spacing-5) auto;
            background: white;
            padding: var(--spacing-5);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .kumowa-circle {
            width: 300px;
            height: 300px;
            position: relative;
            margin: 0 auto;
        }

        .kumowa-segment {
            position: absolute;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-normal);
        }

        .kumowa-top {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FFB74D, #FF9800);
            color: white;
            padding: var(--spacing-4);
            border-radius: var(--radius-lg);
            width: 140px;
        }

        .kumowa-bottom-left {
            bottom: 0;
            left: 0;
            background: linear-gradient(135deg, #4FC3F7, #29B6F6);
            color: white;
            padding: var(--spacing-4);
            border-radius: var(--radius-lg);
            width: 140px;
        }

        .kumowa-bottom-right {
            bottom: 0;
            right: 0;
            background: linear-gradient(135deg, #BA68C8, #9C27B0);
            color: white;
            padding: var(--spacing-4);
            border-radius: var(--radius-lg);
            width: 140px;
        }

        .kumowa-label {
            font-size: 0.875rem;
            margin-bottom: var(--spacing-2);
        }

        .kumowa-value {
            font-family: var(--font-number);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .kumowa-operator {
            position: absolute;
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-700);
        }

        .kumowa-multiply {
            top: 35%;
            left: 25%;
        }

        .kumowa-equals {
            top: 35%;
            right: 25%;
        }

        .kumowa-divide {
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* ===== 問題表示 ===== */
        .problem-display {
            text-align: center;
            margin-bottom: var(--spacing-5);
        }

        .problem-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: var(--spacing-4);
            line-height: 1.6;
            padding: var(--spacing-4);
            background: linear-gradient(135deg, #FFF3E0, #FFFFFF);
            border-radius: var(--radius-lg);
            border: 2px solid var(--accent-orange-400);
        }

        .formula-display {
            font-family: var(--font-number);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-purple-500);
            margin: var(--spacing-5) 0;
            padding: var(--spacing-5);
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .formula-highlight {
            color: var(--accent-orange-500);
            background: linear-gradient(135deg, #FFF3E0, #FFE0B2);
            padding: 0.2em 0.5em;
            border-radius: var(--radius-md);
        }

        /* ===== ビジュアルグラフ ===== */
        .visual-container {
            max-width: 600px;
            margin: var(--spacing-5) auto;
            background: white;
            padding: var(--spacing-5);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-3);
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: var(--spacing-3);
        }

        .bar-label {
            font-weight: 700;
            min-width: 120px;
            font-size: 1rem;
        }

        .bar-container {
            flex: 1;
            height: 40px;
            background: var(--gray-200);
            border-radius: var(--radius-md);
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple-500), var(--accent-purple-400));
            border-radius: var(--radius-md);
            transition: width 1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-family: var(--font-number);
        }

        .bar-value {
            font-weight: 700;
            font-family: var(--font-number);
            min-width: 80px;
            text-align: right;
        }

        /* ===== 円グラフ（SVG） ===== */
        .pie-chart-container {
            text-align: center;
        }

        .pie-legend {
            display: flex;
            justify-content: center;
            gap: var(--spacing-5);
            margin-top: var(--spacing-4);
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
        }

        .legend-color {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        .legend-text {
            font-weight: 700;
            font-size: 1rem;
        }

        /* ===== 入力エリア ===== */
        .input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-5);
        }

        .answer-input {
            font-family: var(--font-number);
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            padding: var(--spacing-4);
            border: 3px solid var(--gray-300);
            border-radius: var(--radius-lg);
            width: 300px;
            max-width: 100%;
            transition: all var(--transition-normal);
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--accent-purple-500);
            box-shadow: 0 0 0 4px rgba(156, 39, 176, 0.2);
        }

        .answer-input.correct {
            border-color: var(--success-500);
            background: linear-gradient(135deg, #F1F8E9, #FFFFFF);
        }

        .answer-input.incorrect {
            border-color: var(--error-500);
            animation: shake 0.5s ease;
        }

        /* ===== 数字パッド ===== */
        .number-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-3);
            max-width: 300px;
            margin: 0 auto;
        }

        .num-btn {
            background: linear-gradient(135deg, #FFFFFF, #F8F9FA);
            border: 2px solid var(--gray-300);
            border-radius: var(--radius-lg);
            padding: var(--spacing-4);
            font-family: var(--font-number);
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .num-btn:hover {
            background: linear-gradient(135deg, #F3E5F5, #FFFFFF);
            border-color: var(--accent-purple-500);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .num-btn:active {
            transform: translateY(0);
        }

        .num-btn.special {
            background: linear-gradient(90deg, var(--accent-orange-400), var(--accent-orange-500));
            color: white;
            border: none;
        }

        /* ===== 選択肢 ===== */
        .choices {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-4);
            margin: var(--spacing-5) 0;
        }

        .choice-btn {
            background: linear-gradient(135deg, #FFFFFF, #F8F9FA);
            border: 3px solid var(--gray-300);
            border-radius: var(--radius-lg);
            padding: var(--spacing-5);
            font-family: var(--font-number);
            font-size: 1.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, #F3E5F5, #FFFFFF);
            border-color: var(--accent-purple-500);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .choice-btn.correct {
            background: linear-gradient(135deg, #C8E6C9, #F1F8E9);
            border-color: var(--success-500);
        }

        .choice-btn.incorrect {
            background: linear-gradient(135deg, #FFCDD2, #FFEBEE);
            border-color: var(--error-500);
            animation: shake 0.5s ease;
        }

        /* ===== ボタン ===== */
        .btn-group {
            display: flex;
            gap: var(--spacing-4);
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            font-family: var(--font-body);
            font-size: 1.125rem;
            font-weight: 700;
            padding: var(--spacing-4) var(--spacing-6);
            border: none;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
            min-width: 150px;
        }

        .btn-primary {
            background: linear-gradient(90deg, #66bb6a 0%, #4caf50 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(90deg, #BA68C8, #9C27B0);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(156, 39, 176, 0.4);
        }

        .btn-warning {
            background: linear-gradient(90deg, #ff9800, #f57c00);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(245, 166, 35, 0.4);
        }

        .btn:disabled {
            background: linear-gradient(90deg, #B0BEC5, #CFD8DC);
            cursor: not-allowed;
            transform: none;
        }

        /* ===== ヒントエリア ===== */
        .hints-container {
            margin: var(--spacing-5) 0;
        }

        .hint-level {
            background: linear-gradient(135deg, #FFF3E0, #FFFFFF);
            border: 2px solid var(--warning-500);
            border-radius: var(--radius-lg);
            padding: var(--spacing-4);
            margin-bottom: var(--spacing-3);
        }

        .hint-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            color: var(--warning-500);
            font-size: 1.125rem;
        }

        .hint-content {
            margin-top: var(--spacing-3);
            font-size: 1rem;
            line-height: 1.6;
            color: var(--gray-900);
        }

        .hint-formula {
            background: white;
            padding: var(--spacing-3);
            border-radius: var(--radius-md);
            margin: var(--spacing-3) 0;
            font-family: var(--font-number);
            font-size: 1.25rem;
            text-align: center;
            font-weight: 700;
            color: var(--accent-purple-500);
        }

        /* ===== フィードバック ===== */
        .feedback {
            text-align: center;
            padding: var(--spacing-4);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-5);
            font-size: 1.25rem;
            font-weight: 700;
            animation: slideDown 0.3s ease;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #C8E6C9, #F1F8E9);
            color: #2E7D32;
            border: 3px solid var(--success-500);
        }

        .feedback.incorrect {
            background: linear-gradient(135deg, #FFCDD2, #FFEBEE);
            color: #D32F2F;
            border: 3px solid var(--error-500);
        }

        /* ===== アニメーション ===== */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes confetti-fall {
            0% {
                opacity: 1;
                transform: translateY(-100vh) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 1000;
            pointer-events: none;
        }

        /* ===== レスポンシブ ===== */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .mode-selection {
                grid-template-columns: 1fr;
            }

            .formula-display {
                font-size: 1.75rem;
            }

            .answer-input {
                width: 100%;
                font-size: 1.5rem;
            }

            .btn {
                min-width: 120px;
                font-size: 1rem;
            }

            .kumowa-circle {
                width: 250px;
                height: 250px;
            }

            .kumowa-top, .kumowa-bottom-left, .kumowa-bottom-right {
                width: 110px;
                padding: var(--spacing-3);
            }

            .kumowa-value {
                font-size: 1.25rem;
            }
        }

        /* ===== アクセシビリティ ===== */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        button:focus, .mode-btn:focus, .choice-btn:focus, .num-btn:focus {
            outline: 3px solid var(--accent-purple-500);
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <header>
            <h1>📊 割合チャレンジ</h1>
            <p class="subtitle">5年生の最難関！割合をマスターしよう</p>
        </header>

        <!-- スコアボード -->
        <div class="scoreboard">
            <div class="score-item">
                <div class="score-label">正解数</div>
                <div class="score-value" id="correct-count">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">問題数</div>
                <div class="score-value" id="total-count">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">正答率</div>
                <div class="score-value" id="accuracy">0%</div>
            </div>
        </div>

        <!-- モード選択 -->
        <div class="mode-selection" id="mode-selection">
            <button class="mode-btn" data-mode="basic" aria-label="基礎モードを選択">
                <div class="mode-icon">🎯</div>
                <div class="mode-title">基礎モード</div>
                <div class="mode-desc">割合の意味を理解しよう</div>
            </button>
            <button class="mode-btn" data-mode="percent" aria-label="百分率モードを選択">
                <div class="mode-icon">💯</div>
                <div class="mode-title">百分率モード</div>
                <div class="mode-desc">パーセント（%）の練習</div>
            </button>
            <button class="mode-btn" data-mode="buai" aria-label="歩合モードを選択">
                <div class="mode-icon">🎲</div>
                <div class="mode-title">歩合モード</div>
                <div class="mode-desc">割・分・厘を学ぼう</div>
            </button>
            <button class="mode-btn" data-mode="real-life" aria-label="実生活モードを選択">
                <div class="mode-icon">🛒</div>
                <div class="mode-title">実生活モード</div>
                <div class="mode-desc">セール・税金など</div>
            </button>
            <button class="mode-btn" data-mode="challenge" aria-label="総合チャレンジモードを選択">
                <div class="mode-icon">🏆</div>
                <div class="mode-title">総合チャレンジ</div>
                <div class="mode-desc">混合問題に挑戦</div>
            </button>
        </div>

        <!-- ゲームエリア -->
        <div class="game-area hidden" id="game-area">
            <div id="feedback-area"></div>
            <div id="problem-area"></div>
            <div class="btn-group">
                <button class="btn btn-warning" id="hint-btn-1" style="display: none;">💡 ヒント①</button>
                <button class="btn btn-warning" id="hint-btn-2" style="display: none;">💡 ヒント②</button>
                <button class="btn btn-warning" id="hint-btn-3" style="display: none;">💡 ヒント③</button>
                <button class="btn btn-secondary" id="next-btn" style="display: none;">次の問題</button>
                <button class="btn btn-primary" id="back-btn">← モード選択に戻る</button>
            </div>
        </div>
    </div>

    <script>
        // ===== グローバル変数 =====
        let currentMode = null;
        let currentProblem = null;
        let correctCount = 0;
        let totalCount = 0;
        let currentHintLevel = 0;

        // ===== DOM要素 =====
        const modeSelection = document.getElementById('mode-selection');
        const gameArea = document.getElementById('game-area');
        const problemArea = document.getElementById('problem-area');
        const feedbackArea = document.getElementById('feedback-area');
        const correctCountEl = document.getElementById('correct-count');
        const totalCountEl = document.getElementById('total-count');
        const accuracyEl = document.getElementById('accuracy');
        const hintBtn1 = document.getElementById('hint-btn-1');
        const hintBtn2 = document.getElementById('hint-btn-2');
        const hintBtn3 = document.getElementById('hint-btn-3');
        const nextBtn = document.getElementById('next-btn');
        const backBtn = document.getElementById('back-btn');

        // ===== モード選択 =====
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentMode = btn.dataset.mode;
                startMode(currentMode);
            });
        });

        // ===== モード開始 =====
        function startMode(mode) {
            modeSelection.classList.add('hidden');
            gameArea.classList.remove('hidden');
            nextBtn.style.display = 'none';
            currentHintLevel = 0;
            resetHintButtons();
            generateProblem(mode);
        }

        // ===== ヒントボタンのリセット =====
        function resetHintButtons() {
            hintBtn1.style.display = 'inline-block';
            hintBtn2.style.display = 'inline-block';
            hintBtn3.style.display = 'inline-block';
            hintBtn1.disabled = false;
            hintBtn2.disabled = false;
            hintBtn3.disabled = false;
            hintBtn1.textContent = '💡 ヒント①';
            hintBtn2.textContent = '💡 ヒント②';
            hintBtn3.textContent = '💡 ヒント③';
        }

        // ===== 問題生成 =====
        function generateProblem(mode) {
            feedbackArea.innerHTML = '';
            currentHintLevel = 0;

            switch(mode) {
                case 'basic':
                    generateBasicProblem();
                    break;
                case 'percent':
                    generatePercentProblem();
                    break;
                case 'buai':
                    generateBuaiProblem();
                    break;
                case 'real-life':
                    generateRealLifeProblem();
                    break;
                case 'challenge':
                    generateChallengeProblem();
                    break;
            }
        }

        // ===== 基礎モード =====
        function generateBasicProblem() {
            // 比べる量 ÷ もとにする量 = 割合
            const moto = Math.floor(Math.random() * 90 + 10); // 10-99
            const wariai = (Math.random() * 1.5 + 0.5).toFixed(2); // 0.5-2.0
            const kurabe = Math.round(moto * parseFloat(wariai));

            const problemTypes = [
                {
                    type: 'find-wariai',
                    text: `${moto}個のりんごをもとにすると、${kurabe}個のみかんは何倍ですか？`,
                    answer: (kurabe / moto).toFixed(2),
                    hints: [
                        '何を求めるか考えよう。「もとにする量」と「比べる量」から「割合」を求めるよ。',
                        '「く・も・わ」の図を使おう！割合 = 比べる量 ÷ もとにする量',
                        `式：${kurabe} ÷ ${moto} = ${(kurabe / moto).toFixed(2)}`
                    ],
                    kumowa: { kurabe, moto, wariai: '?' }
                },
                {
                    type: 'find-kurabe',
                    text: `${moto}mの道のりの${wariai}倍の長さは何mですか？`,
                    answer: kurabe.toString(),
                    hints: [
                        '「もとにする量」と「割合」から「比べる量」を求める問題だよ。',
                        '「く・も・わ」の図：比べる量 = もとにする量 × 割合',
                        `式：${moto} × ${wariai} = ${kurabe}`
                    ],
                    kumowa: { kurabe: '?', moto, wariai }
                },
                {
                    type: 'find-moto',
                    text: `ある数の${wariai}倍が${kurabe}です。ある数はいくつですか？`,
                    answer: moto.toString(),
                    hints: [
                        '「比べる量」と「割合」から「もとにする量」を求める問題だよ。',
                        '「く・も・わ」の図：もとにする量 = 比べる量 ÷ 割合',
                        `式：${kurabe} ÷ ${wariai} = ${moto}`
                    ],
                    kumowa: { kurabe, moto: '?', wariai }
                }
            ];

            const problem = problemTypes[Math.floor(Math.random() * problemTypes.length)];
            currentProblem = problem;

            problemArea.innerHTML = `
                <div class="problem-display">
                    <div class="problem-text">${problem.text}</div>
                </div>
                ${createKumowaCircle(problem.kumowa)}
                ${createBarChart(problem.kumowa)}
                <div class="input-area">
                    <input type="text" class="answer-input" id="answer-input"
                           placeholder="答えを入力" inputmode="decimal"
                           aria-label="答えを入力してください">
                    ${createNumberPad()}
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="submit-btn">答え合わせ</button>
                </div>
                <div class="hints-container" id="hints-container"></div>
            `;

            setupNumberPadEvents();
            document.getElementById('submit-btn').addEventListener('click', () => checkAnswer(problem.answer));
        }

        // ===== く・も・わの円図 =====
        function createKumowaCircle(data) {
            return `
                <div class="kumowa-diagram">
                    <h3 style="text-align: center; margin-bottom: var(--spacing-4); color: var(--accent-purple-500);">く・も・わの図</h3>
                    <div class="kumowa-circle">
                        <div class="kumowa-segment kumowa-top">
                            <div class="kumowa-label">く（比べる量）</div>
                            <div class="kumowa-value">${data.kurabe}</div>
                        </div>
                        <div class="kumowa-operator kumowa-multiply">×</div>
                        <div class="kumowa-operator kumowa-equals">=</div>
                        <div class="kumowa-operator kumowa-divide">÷</div>
                        <div class="kumowa-segment kumowa-bottom-left">
                            <div class="kumowa-label">も（もとの量）</div>
                            <div class="kumowa-value">${data.moto}</div>
                        </div>
                        <div class="kumowa-segment kumowa-bottom-right">
                            <div class="kumowa-label">わ（割合）</div>
                            <div class="kumowa-value">${data.wariai}</div>
                        </div>
                    </div>
                    <p style="text-align: center; margin-top: var(--spacing-4); font-size: 0.875rem; color: var(--gray-600);">
                        く = も × わ ／ も = く ÷ わ ／ わ = く ÷ も
                    </p>
                </div>
            `;
        }

        // ===== バーチャート =====
        function createBarChart(data) {
            const motoValue = data.moto !== '?' ? parseFloat(data.moto) : 100;
            const kurabeValue = data.kurabe !== '?' ? parseFloat(data.kurabe) : 100;
            const motoPercent = 100;
            const kurabePercent = (kurabeValue / motoValue) * 100;

            return `
                <div class="visual-container">
                    <h3 style="text-align: center; margin-bottom: var(--spacing-4); color: var(--accent-purple-500);">視覚化</h3>
                    <div class="bar-chart">
                        <div class="bar-row">
                            <div class="bar-label">もとにする量</div>
                            <div class="bar-container">
                                <div class="bar-fill" style="width: ${motoPercent}%; background: linear-gradient(90deg, #4FC3F7, #29B6F6);">
                                    ${data.moto !== '?' ? data.moto : ''}
                                </div>
                            </div>
                            <div class="bar-value">${data.moto !== '?' ? data.moto : '?'}</div>
                        </div>
                        <div class="bar-row">
                            <div class="bar-label">比べる量</div>
                            <div class="bar-container">
                                <div class="bar-fill" style="width: ${data.kurabe !== '?' ? kurabePercent : 100}%; background: linear-gradient(90deg, #BA68C8, #9C27B0);">
                                    ${data.kurabe !== '?' ? data.kurabe : ''}
                                </div>
                            </div>
                            <div class="bar-value">${data.kurabe !== '?' ? data.kurabe : '?'}</div>
                        </div>
                    </div>
                    <p style="text-align: center; margin-top: var(--spacing-4); font-weight: 700;">
                        割合：${data.wariai !== '?' ? data.wariai + '倍' : '?倍'}
                    </p>
                </div>
            `;
        }

        // ===== 百分率モード =====
        function generatePercentProblem() {
            const moto = Math.floor(Math.random() * 900 + 100); // 100-999
            const percent = Math.floor(Math.random() * 80 + 20); // 20-99%
            const wariai = percent / 100;
            const kurabe = Math.round(moto * wariai);

            const problemTypes = [
                {
                    text: `${moto}円の${percent}%は何円ですか？`,
                    answer: kurabe.toString(),
                    hints: [
                        `${percent}%を小数で表すと${wariai}だよ。`,
                        `式：${moto} × ${wariai} = ${kurabe}`,
                        `答え：${kurabe}円`
                    ]
                },
                {
                    text: `${kurabe}円は${moto}円の何%ですか？`,
                    answer: percent.toString(),
                    hints: [
                        '割合を求めてから、100倍してパーセントにするよ。',
                        `式：${kurabe} ÷ ${moto} = ${wariai}、${wariai} × 100 = ${percent}%`,
                        `答え：${percent}%`
                    ]
                },
                {
                    text: `ある金額の${percent}%が${kurabe}円でした。ある金額はいくらですか？`,
                    answer: moto.toString(),
                    hints: [
                        `${percent}%を小数で表すと${wariai}だよ。`,
                        `式：${kurabe} ÷ ${wariai} = ${moto}`,
                        `答え：${moto}円`
                    ]
                }
            ];

            const problem = problemTypes[Math.floor(Math.random() * problemTypes.length)];
            currentProblem = problem;

            problemArea.innerHTML = `
                <div class="problem-display">
                    <div class="problem-text">${problem.text}</div>
                    <div class="formula-display">
                        ${percent}% = <span class="formula-highlight">${wariai}</span>
                    </div>
                </div>
                ${createPieChart(percent)}
                <div class="input-area">
                    <input type="text" class="answer-input" id="answer-input"
                           placeholder="答えを入力" inputmode="decimal"
                           aria-label="答えを入力してください">
                    ${createNumberPad()}
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="submit-btn">答え合わせ</button>
                </div>
                <div class="hints-container" id="hints-container"></div>
            `;

            setupNumberPadEvents();
            document.getElementById('submit-btn').addEventListener('click', () => checkAnswer(problem.answer));
        }

        // ===== 円グラフ（SVG） =====
        function createPieChart(percent) {
            const angle = (percent / 100) * 360;
            const radius = 80;
            const cx = 100;
            const cy = 100;

            // 円弧の計算
            const startAngle = -90;
            const endAngle = startAngle + angle;
            const startRad = (startAngle * Math.PI) / 180;
            const endRad = (endAngle * Math.PI) / 180;

            const x1 = cx + radius * Math.cos(startRad);
            const y1 = cy + radius * Math.sin(startRad);
            const x2 = cx + radius * Math.cos(endRad);
            const y2 = cy + radius * Math.sin(endRad);

            const largeArc = angle > 180 ? 1 : 0;

            const pathData = `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;

            return `
                <div class="visual-container">
                    <div class="pie-chart-container">
                        <svg width="200" height="200" viewBox="0 0 200 200">
                            <circle cx="100" cy="100" r="80" fill="#E0E0E0" />
                            <path d="${pathData}" fill="#9C27B0" />
                            <text x="100" y="105" text-anchor="middle" font-size="24" font-weight="bold" fill="white">${percent}%</text>
                        </svg>
                        <div class="pie-legend">
                            <div class="legend-item">
                                <div class="legend-color" style="background: #9C27B0;"></div>
                                <div class="legend-text">${percent}%</div>
                            </div>
                            <div class="legend-item">
                                <div class="legend-color" style="background: #E0E0E0;"></div>
                                <div class="legend-text">${100 - percent}%</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ===== 歩合モード =====
        function generateBuaiProblem() {
            const buaiData = [
                { name: '1割', value: 0.1, display: '1割' },
                { name: '2割', value: 0.2, display: '2割' },
                { name: '3割', value: 0.3, display: '3割' },
                { name: '5割', value: 0.5, display: '5割' },
                { name: '1割5分', value: 0.15, display: '1割5分' },
                { name: '2割5分', value: 0.25, display: '2割5分' }
            ];

            const buai = buaiData[Math.floor(Math.random() * buaiData.length)];
            const moto = Math.floor(Math.random() * 900 + 100); // 100-999
            const kurabe = Math.round(moto * buai.value);

            currentProblem = {
                answer: kurabe.toString(),
                hints: [
                    `${buai.display}は小数で${buai.value}だよ。`,
                    `式：${moto} × ${buai.value} = ${kurabe}`,
                    `答え：${kurabe}`
                ]
            };

            problemArea.innerHTML = `
                <div class="problem-display">
                    <div class="problem-text">
                        ${moto}円の${buai.display}引きは何円引きですか？
                    </div>
                    <div class="formula-display">
                        ${buai.display} = <span class="formula-highlight">${buai.value}</span>
                    </div>
                </div>
                <div class="visual-container">
                    <h3 style="text-align: center; margin-bottom: var(--spacing-4);">歩合の覚え方</h3>
                    <div style="background: white; padding: var(--spacing-4); border-radius: var(--radius-md); margin-bottom: var(--spacing-3);">
                        <strong>1割</strong> = 0.1 = 10%
                    </div>
                    <div style="background: white; padding: var(--spacing-4); border-radius: var(--radius-md); margin-bottom: var(--spacing-3);">
                        <strong>1分</strong> = 0.01 = 1%
                    </div>
                    <div style="background: white; padding: var(--spacing-4); border-radius: var(--radius-md);">
                        <strong>1厘</strong> = 0.001 = 0.1%
                    </div>
                </div>
                <div class="input-area">
                    <input type="text" class="answer-input" id="answer-input"
                           placeholder="答えを入力" inputmode="decimal"
                           aria-label="答えを入力してください">
                    ${createNumberPad()}
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="submit-btn">答え合わせ</button>
                </div>
                <div class="hints-container" id="hints-container"></div>
            `;

            setupNumberPadEvents();
            document.getElementById('submit-btn').addEventListener('click', () => checkAnswer(currentProblem.answer));
        }

        // ===== 実生活モード =====
        function generateRealLifeProblem() {
            const scenarios = [
                {
                    type: 'sale',
                    generate: () => {
                        const price = Math.floor(Math.random() * 9000 + 1000); // 1000-9999円
                        const discount = [10, 20, 30, 40][Math.floor(Math.random() * 4)];
                        const salePrice = Math.round(price * (100 - discount) / 100);
                        return {
                            text: `${price}円の商品が${discount}%オフのセールです。セール価格はいくらですか？`,
                            answer: salePrice.toString(),
                            hints: [
                                `${discount}%引きということは、${100 - discount}%の値段になるよ。`,
                                `式：${price} × ${(100 - discount) / 100} = ${salePrice}`,
                                `答え：${salePrice}円`
                            ]
                        };
                    }
                },
                {
                    type: 'tax',
                    generate: () => {
                        const price = Math.floor(Math.random() * 900 + 100) * 10; // 1000-9990円
                        const tax = 10;
                        const total = Math.round(price * 1.1);
                        return {
                            text: `${price}円の商品に消費税${tax}%がかかります。税込み価格はいくらですか？`,
                            answer: total.toString(),
                            hints: [
                                `消費税${tax}%を加えると、${100 + tax}%の値段になるよ。`,
                                `式：${price} × ${(100 + tax) / 100} = ${total}`,
                                `答え：${total}円`
                            ]
                        };
                    }
                },
                {
                    type: 'test',
                    generate: () => {
                        const total = 100;
                        const correct = Math.floor(Math.random() * 30 + 60); // 60-89点
                        return {
                            text: `テストで${total}点満点中${correct}点取りました。正答率は何%ですか？`,
                            answer: correct.toString(),
                            hints: [
                                '正答率 = 正解数 ÷ 全体 × 100',
                                `式：${correct} ÷ ${total} × 100 = ${correct}%`,
                                `答え：${correct}%`
                            ]
                        };
                    }
                },
                {
                    type: 'population',
                    generate: () => {
                        const lastYear = Math.floor(Math.random() * 4000 + 1000); // 1000-4999人
                        const increase = [5, 10, 15, 20][Math.floor(Math.random() * 4)];
                        const thisYear = Math.round(lastYear * (100 + increase) / 100);
                        return {
                            text: `去年の人口は${lastYear}人でした。今年は去年より${increase}%増えました。今年の人口は何人ですか？`,
                            answer: thisYear.toString(),
                            hints: [
                                `${increase}%増えるということは、${100 + increase}%になるということだよ。`,
                                `式：${lastYear} × ${(100 + increase) / 100} = ${thisYear}`,
                                `答え：${thisYear}人`
                            ]
                        };
                    }
                }
            ];

            const scenario = scenarios[Math.floor(Math.random() * scenarios.length)];
            const problem = scenario.generate();
            currentProblem = problem;

            problemArea.innerHTML = `
                <div class="problem-display">
                    <div class="problem-text">${problem.text}</div>
                </div>
                <div class="input-area">
                    <input type="text" class="answer-input" id="answer-input"
                           placeholder="答えを入力" inputmode="decimal"
                           aria-label="答えを入力してください">
                    ${createNumberPad()}
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="submit-btn">答え合わせ</button>
                </div>
                <div class="hints-container" id="hints-container"></div>
            `;

            setupNumberPadEvents();
            document.getElementById('submit-btn').addEventListener('click', () => checkAnswer(problem.answer));
        }

        // ===== 総合チャレンジモード =====
        function generateChallengeProblem() {
            const modes = ['basic', 'percent', 'buai', 'real-life'];
            const randomMode = modes[Math.floor(Math.random() * modes.length)];

            // 各モードの問題生成関数を呼び出し
            switch(randomMode) {
                case 'basic': generateBasicProblem(); break;
                case 'percent': generatePercentProblem(); break;
                case 'buai': generateBuaiProblem(); break;
                case 'real-life': generateRealLifeProblem(); break;
            }
        }

        // ===== 数字パッド作成 =====
        function createNumberPad() {
            return `
                <div class="number-pad">
                    <button class="num-btn" data-num="7">7</button>
                    <button class="num-btn" data-num="8">8</button>
                    <button class="num-btn" data-num="9">9</button>
                    <button class="num-btn" data-num="4">4</button>
                    <button class="num-btn" data-num="5">5</button>
                    <button class="num-btn" data-num="6">6</button>
                    <button class="num-btn" data-num="1">1</button>
                    <button class="num-btn" data-num="2">2</button>
                    <button class="num-btn" data-num="3">3</button>
                    <button class="num-btn" data-num=".">.</button>
                    <button class="num-btn" data-num="0">0</button>
                    <button class="num-btn special" data-num="clear">消去</button>
                </div>
            `;
        }

        // ===== 数字パッドイベント設定 =====
        function setupNumberPadEvents() {
            const input = document.getElementById('answer-input');

            document.querySelectorAll('.num-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const num = btn.dataset.num;

                    if (num === 'clear') {
                        input.value = '';
                    } else {
                        input.value += num;
                    }

                    input.focus();
                });
            });

            // Enterキーで答え合わせ
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const submitBtn = document.getElementById('submit-btn');
                    if (submitBtn) submitBtn.click();
                }
            });
        }

        // ===== 答え合わせ =====
        function checkAnswer(correctAnswer) {
            const input = document.getElementById('answer-input');
            const userAnswer = input.value.trim();

            // 小数の比較（許容誤差あり）
            const correct = Math.abs(parseFloat(userAnswer) - parseFloat(correctAnswer)) < 0.01;

            if (correct) {
                input.classList.add('correct');
                showFeedback(true, `正解！答えは ${correctAnswer} だよ！`);
                createConfetti();
                correctCount++;
            } else {
                input.classList.add('incorrect');
                showFeedback(false, `残念...正解は ${correctAnswer} だよ。もう一度挑戦してみよう！`);
            }

            totalCount++;
            updateScore();

            const submitBtn = document.getElementById('submit-btn');
            if (submitBtn) submitBtn.disabled = true;

            nextBtn.style.display = 'inline-block';
            hintBtn1.disabled = true;
            hintBtn2.disabled = true;
            hintBtn3.disabled = true;
        }

        // ===== フィードバック表示 =====
        function showFeedback(isCorrect, message) {
            feedbackArea.innerHTML = `
                <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                    ${isCorrect ? '🎉' : '😅'} ${message}
                </div>
            `;
        }

        // ===== スコア更新 =====
        function updateScore() {
            correctCountEl.textContent = correctCount;
            totalCountEl.textContent = totalCount;
            const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
            accuracyEl.textContent = accuracy + '%';
        }

        // ===== 紙吹雪アニメーション =====
        function createConfetti() {
            const colors = ['#FFD54F', '#FF9800', '#4CAF50', '#4A90E2', '#E91E63', '#9C27B0'];

            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animation = `confetti-fall ${2 + Math.random() * 2}s ease-out`;
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 4000);
                }, i * 50);
            }
        }

        // ===== ヒントボタン =====
        function showHint(level) {
            if (!currentProblem || !currentProblem.hints) return;

            const hintsContainer = document.getElementById('hints-container');
            if (!hintsContainer) return;

            const hintContent = currentProblem.hints[level - 1];
            if (!hintContent) return;

            const hintDiv = document.createElement('div');
            hintDiv.className = 'hint-level';
            hintDiv.innerHTML = `
                <div class="hint-header">
                    💡 ヒント${level}
                </div>
                <div class="hint-content">${hintContent}</div>
            `;

            hintsContainer.appendChild(hintDiv);

            // ボタンを無効化
            if (level === 1) hintBtn1.disabled = true;
            if (level === 2) hintBtn2.disabled = true;
            if (level === 3) hintBtn3.disabled = true;
        }

        hintBtn1.addEventListener('click', () => showHint(1));
        hintBtn2.addEventListener('click', () => showHint(2));
        hintBtn3.addEventListener('click', () => showHint(3));

        // ===== 次の問題ボタン =====
        nextBtn.addEventListener('click', () => {
            generateProblem(currentMode);
            nextBtn.style.display = 'none';
            resetHintButtons();

            // ヒントコンテナをクリア
            const hintsContainer = document.getElementById('hints-container');
            if (hintsContainer) hintsContainer.innerHTML = '';
        });

        // ===== モード選択に戻る =====
        backBtn.addEventListener('click', () => {
            gameArea.classList.add('hidden');
            modeSelection.classList.remove('hidden');
            currentMode = null;
            problemArea.innerHTML = '';
            feedbackArea.innerHTML = '';
        });

        // ===== 初期化 =====
        updateScore();
    </script>
</body>
</html>
