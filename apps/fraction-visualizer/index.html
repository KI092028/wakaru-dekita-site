<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ピザやバーで分数を見える化！通分・約分から分数の計算まで、楽しく学べるよ。">
    <title>分数ビジュアライザー｜わかる！できた！算数学習サイト</title>
    <style>
        :root {
            /* カラー変数 */
            --primary-500: #4A90E2;
            --primary-400: #5CA3EF;
            --primary-600: #3A7BCF;
            --secondary-500: #7ED321;
            --secondary-400: #96E03A;
            --accent-orange-500: #F5A623;
            --accent-yellow-500: #FFD54F;
            --error-500: #FF6B6B;
            --success-500: #7ED321;
            --gray-900: #2C3E50;
            --gray-800: #34495E;
            --gray-700: #546E7A;
            --gray-600: #607D8B;
            --gray-300: #CFD8DC;
            --gray-200: #ECEFF1;
            --gray-100: #F5F7F8;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8F9FA;

            /* ピザカラー */
            --pizza-crust: #FFD54F;
            --pizza-sauce: #E94B3C;
            --pizza-cheese: #FFA726;

            /* 水カラー */
            --water-color: #4FC3F7;
            --water-light: #81D4FA;

            /* バーカラー */
            --bar-filled: #7ED321;
            --bar-empty: #E0E0E0;

            /* タイポグラフィ */
            --font-heading: 'UD Digi Kyokasho NK-B', 'UD Digi Kyokasho N-B', '游ゴシック体', sans-serif;
            --font-body: 'UD Digi Kyokasho NK-R', 'UD Digi Kyokasho N-R', '游ゴシック体', sans-serif;
            --font-number: 'Poppins', 'Roboto', sans-serif;

            /* スペーシング */
            --spacing-2: 0.5rem;
            --spacing-3: 0.75rem;
            --spacing-4: 1rem;
            --spacing-5: 1.5rem;
            --spacing-6: 2rem;

            /* ボーダーラディウス */
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;

            /* シャドウ */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 15px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.15);

            /* トランジション */
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #E3F2FD 0%, #F3E5F5 50%, #FFF3E0 100%);
            min-height: 100vh;
            padding: var(--spacing-4);
            color: var(--gray-900);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: var(--spacing-5);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--primary-600);
            margin-bottom: var(--spacing-3);
        }

        .subtitle {
            color: var(--gray-700);
            font-size: 1.1rem;
        }

        /* モード選択 */
        .mode-selector {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-4);
            margin-bottom: var(--spacing-5);
            box-shadow: var(--shadow-md);
        }

        .mode-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: var(--spacing-3);
            margin-top: var(--spacing-4);
        }

        .mode-btn {
            background: linear-gradient(135deg, var(--gray-100), var(--bg-primary));
            border: 2px solid var(--gray-300);
            border-radius: var(--radius-md);
            padding: var(--spacing-4);
            cursor: pointer;
            transition: all var(--transition-normal);
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--gray-800);
            text-align: center;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-500);
        }

        .mode-btn.active {
            background: linear-gradient(90deg, var(--primary-500), var(--primary-400));
            color: white;
            border-color: var(--primary-600);
            box-shadow: var(--shadow-md);
        }

        /* メインコンテンツ */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: var(--spacing-5);
        }

        @media (max-width: 1023px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* ビジュアル表示エリア */
        .visual-area {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-5);
            box-shadow: var(--shadow-md);
        }

        .visual-controls {
            display: flex;
            justify-content: center;
            gap: var(--spacing-3);
            margin-bottom: var(--spacing-4);
        }

        .visual-btn {
            background: var(--gray-100);
            border: 2px solid var(--gray-300);
            border-radius: var(--radius-full);
            padding: var(--spacing-2) var(--spacing-4);
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gray-700);
            transition: all var(--transition-fast);
        }

        .visual-btn:hover {
            border-color: var(--primary-500);
            color: var(--primary-500);
        }

        .visual-btn.active {
            background: linear-gradient(90deg, var(--secondary-500), var(--secondary-400));
            color: white;
            border-color: var(--secondary-500);
        }

        .svg-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            margin-bottom: var(--spacing-4);
        }

        svg {
            max-width: 100%;
            height: auto;
        }

        /* コントロールパネル */
        .control-panel {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-5);
            box-shadow: var(--shadow-md);
        }

        .control-section {
            margin-bottom: var(--spacing-5);
        }

        .control-section h3 {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            color: var(--gray-800);
            margin-bottom: var(--spacing-3);
        }

        .fraction-display {
            text-align: center;
            margin-bottom: var(--spacing-4);
        }

        .fraction {
            font-family: var(--font-number);
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary-600);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
        }

        .fraction-line {
            width: 100%;
            height: 3px;
            background: var(--gray-800);
            margin: 4px 0;
        }

        .input-group {
            margin-bottom: var(--spacing-4);
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: var(--spacing-2);
            font-size: 0.95rem;
        }

        .slider-container {
            margin-bottom: var(--spacing-3);
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            background: var(--gray-200);
            border-radius: var(--radius-full);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-400));
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--primary-500), var(--primary-400));
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: var(--shadow-sm);
        }

        .slider-value {
            text-align: center;
            font-family: var(--font-number);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-600);
            margin-top: var(--spacing-2);
        }

        .number-input {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: var(--spacing-2);
            align-items: center;
            margin-bottom: var(--spacing-3);
        }

        .number-input input {
            width: 100%;
            padding: var(--spacing-3);
            border: 2px solid var(--gray-300);
            border-radius: var(--radius-md);
            font-family: var(--font-number);
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: var(--gray-900);
        }

        .number-input input:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .number-input .divider {
            font-family: var(--font-number);
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-700);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-3);
            margin-top: var(--spacing-4);
        }

        .btn {
            padding: var(--spacing-3) var(--spacing-4);
            border: none;
            border-radius: var(--radius-full);
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-normal);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--secondary-500), var(--secondary-400));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: linear-gradient(90deg, var(--primary-500), var(--primary-400));
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* 等価分数表示 */
        .equivalent-fractions {
            background: var(--gray-100);
            border-radius: var(--radius-md);
            padding: var(--spacing-4);
            margin-top: var(--spacing-4);
        }

        .equivalent-fractions h4 {
            font-size: 0.95rem;
            color: var(--gray-700);
            margin-bottom: var(--spacing-3);
            font-weight: 600;
        }

        .equivalent-list {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-2);
        }

        .equivalent-item {
            background: white;
            padding: var(--spacing-2) var(--spacing-3);
            border-radius: var(--radius-md);
            font-family: var(--font-number);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-600);
            box-shadow: var(--shadow-sm);
        }

        /* 計算モード */
        .calculation-area {
            background: var(--gray-100);
            border-radius: var(--radius-md);
            padding: var(--spacing-4);
            margin-top: var(--spacing-4);
        }

        .calculation-display {
            font-family: var(--font-number);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
            text-align: center;
            margin-bottom: var(--spacing-4);
        }

        .fraction-small {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            font-size: 1.2rem;
            margin: 0 var(--spacing-2);
            vertical-align: middle;
        }

        .fraction-small .fraction-line {
            width: 100%;
            height: 2px;
            margin: 2px 0;
        }

        .operator {
            font-size: 2rem;
            margin: 0 var(--spacing-3);
            color: var(--accent-orange-500);
        }

        /* フィードバック */
        .feedback {
            margin-top: var(--spacing-4);
            padding: var(--spacing-4);
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        .feedback.show {
            opacity: 1;
        }

        .feedback.success {
            background: linear-gradient(135deg, #C8E6C9, #A5D6A7);
            color: #2E7D32;
        }

        .feedback.error {
            background: linear-gradient(135deg, #FFCDD2, #EF9A9A);
            color: #C62828;
        }

        /* アニメーション */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        /* 説明テキスト */
        .explanation {
            background: var(--primary-100);
            border-left: 4px solid var(--primary-500);
            padding: var(--spacing-3);
            border-radius: var(--radius-md);
            margin-top: var(--spacing-4);
            font-size: 0.95rem;
            color: var(--gray-800);
            line-height: 1.6;
        }

        /* レスポンシブ */
        @media (max-width: 767px) {
            h1 {
                font-size: 1.5rem;
            }

            .mode-buttons {
                grid-template-columns: 1fr;
            }

            .fraction {
                font-size: 2rem;
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }
        }

        /* アクセシビリティ */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        *:focus {
            outline: 3px solid var(--primary-500);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>分数ビジュアライザー</h1>
            <p class="subtitle">ピザやバーで分数を見える化！楽しく学ぼう</p>
        </header>

        <!-- モード選択 -->
        <div class="mode-selector">
            <h2 style="text-align: center; font-size: 1.2rem; margin-bottom: var(--spacing-3);">学習モードを選ぼう</h2>
            <div class="mode-buttons">
                <button class="mode-btn active" data-mode="basic">
                    <div>分数の基礎</div>
                    <small style="display: block; margin-top: 4px; font-weight: 400;">3年生</small>
                </button>
                <button class="mode-btn" data-mode="simplify">
                    <div>通分・約分</div>
                    <small style="display: block; margin-top: 4px; font-weight: 400;">4年生</small>
                </button>
                <button class="mode-btn" data-mode="addition">
                    <div>足し算・引き算</div>
                    <small style="display: block; margin-top: 4px; font-weight: 400;">4-5年生</small>
                </button>
                <button class="mode-btn" data-mode="mixed">
                    <div>帯分数・仮分数</div>
                    <small style="display: block; margin-top: 4px; font-weight: 400;">4年生</small>
                </button>
                <button class="mode-btn" data-mode="multiply">
                    <div>かけ算・わり算</div>
                    <small style="display: block; margin-top: 4px; font-weight: 400;">5-6年生</small>
                </button>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="main-content">
            <!-- ビジュアル表示エリア -->
            <div class="visual-area">
                <div class="visual-controls">
                    <button class="visual-btn active" data-visual="pizza">🍕 ピザ</button>
                    <button class="visual-btn" data-visual="bar">📊 バー</button>
                    <button class="visual-btn" data-visual="water">💧 水</button>
                </div>
                <div class="svg-container" id="svgContainer">
                    <svg id="fractionSvg" width="400" height="400" viewBox="0 0 400 400">
                        <!-- SVG will be generated by JavaScript -->
                    </svg>
                </div>
                <div class="explanation" id="explanation">
                    <strong>分数の基礎モード:</strong> スライダーを動かして、分数がどう変わるか見てみよう！
                </div>
            </div>

            <!-- コントロールパネル -->
            <div class="control-panel">
                <div class="control-section">
                    <h3>分数を作ろう</h3>
                    <div class="fraction-display">
                        <div class="fraction">
                            <span id="displayNumerator">1</span>
                            <div class="fraction-line"></div>
                            <span id="displayDenominator">4</span>
                        </div>
                    </div>

                    <!-- 分子スライダー -->
                    <div class="input-group" id="numeratorGroup">
                        <label for="numeratorSlider">分子 (ぶんし)</label>
                        <div class="slider-container">
                            <input type="range" id="numeratorSlider" min="0" max="12" value="1" aria-label="分子を選択">
                            <div class="slider-value" id="numeratorValue">1</div>
                        </div>
                    </div>

                    <!-- 分母スライダー -->
                    <div class="input-group" id="denominatorGroup">
                        <label for="denominatorSlider">分母 (ぶんぼ)</label>
                        <div class="slider-container">
                            <input type="range" id="denominatorSlider" min="2" max="12" value="4" aria-label="分母を選択">
                            <div class="slider-value" id="denominatorValue">4</div>
                        </div>
                    </div>

                    <!-- 計算エリア (計算モードで表示) -->
                    <div class="calculation-area" id="calculationArea" style="display: none;">
                        <h4 style="text-align: center; margin-bottom: var(--spacing-3);">計算しよう</h4>
                        <div class="calculation-display" id="calculationDisplay">
                            <!-- 計算式がここに表示される -->
                        </div>
                    </div>

                    <!-- 等価分数 -->
                    <div class="equivalent-fractions" id="equivalentSection">
                        <h4>同じ大きさの分数</h4>
                        <div class="equivalent-list" id="equivalentList">
                            <!-- JavaScript で生成 -->
                        </div>
                    </div>

                    <!-- アクションボタン -->
                    <div class="action-buttons" id="actionButtons">
                        <button class="btn btn-primary" id="simplifyBtn">約分する</button>
                        <button class="btn btn-secondary" id="randomBtn">ランダム</button>
                    </div>

                    <!-- フィードバック -->
                    <div class="feedback" id="feedback"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // アプリの状態管理
        const state = {
            mode: 'basic',
            visualType: 'pizza',
            numerator: 1,
            denominator: 4,
            fraction2: { numerator: 1, denominator: 2 },
            operator: '+',
            result: null
        };

        // DOM要素
        const elements = {
            svg: document.getElementById('fractionSvg'),
            numeratorSlider: document.getElementById('numeratorSlider'),
            denominatorSlider: document.getElementById('denominatorSlider'),
            numeratorValue: document.getElementById('numeratorValue'),
            denominatorValue: document.getElementById('denominatorValue'),
            displayNumerator: document.getElementById('displayNumerator'),
            displayDenominator: document.getElementById('displayDenominator'),
            equivalentList: document.getElementById('equivalentList'),
            feedback: document.getElementById('feedback'),
            explanation: document.getElementById('explanation'),
            calculationArea: document.getElementById('calculationArea'),
            calculationDisplay: document.getElementById('calculationDisplay'),
            actionButtons: document.getElementById('actionButtons'),
            numeratorGroup: document.getElementById('numeratorGroup'),
            denominatorGroup: document.getElementById('denominatorGroup'),
            equivalentSection: document.getElementById('equivalentSection')
        };

        // 初期化
        function init() {
            setupEventListeners();
            updateDisplay();
        }

        // イベントリスナー設定
        function setupEventListeners() {
            // モード切り替え
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.mode = btn.dataset.mode;
                    updateModeDisplay();
                });
            });

            // ビジュアルタイプ切り替え
            document.querySelectorAll('.visual-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.visual-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.visualType = btn.dataset.visual;
                    updateDisplay();
                });
            });

            // スライダー
            elements.numeratorSlider.addEventListener('input', (e) => {
                state.numerator = parseInt(e.target.value);
                elements.numeratorValue.textContent = state.numerator;
                elements.displayNumerator.textContent = state.numerator;
                updateDisplay();
            });

            elements.denominatorSlider.addEventListener('input', (e) => {
                state.denominator = parseInt(e.target.value);
                elements.denominatorValue.textContent = state.denominator;
                elements.displayDenominator.textContent = state.denominator;
                // 分子の最大値を分母に合わせる
                elements.numeratorSlider.max = state.denominator * 2;
                if (state.numerator > state.denominator * 2) {
                    state.numerator = state.denominator;
                    elements.numeratorSlider.value = state.numerator;
                    elements.numeratorValue.textContent = state.numerator;
                    elements.displayNumerator.textContent = state.numerator;
                }
                updateDisplay();
            });

            // ボタン
            document.getElementById('simplifyBtn').addEventListener('click', handleSimplify);
            document.getElementById('randomBtn').addEventListener('click', generateRandom);
        }

        // モード表示更新
        function updateModeDisplay() {
            const explanations = {
                basic: '<strong>分数の基礎モード:</strong> スライダーを動かして、分数がどう変わるか見てみよう！',
                simplify: '<strong>通分・約分モード:</strong> 同じ大きさの分数を見つけて、簡単な形にしよう！',
                addition: '<strong>足し算・引き算モード:</strong> 分数の計算を視覚的に理解しよう！',
                mixed: '<strong>帯分数・仮分数モード:</strong> 1より大きい分数を学ぼう！',
                multiply: '<strong>かけ算・わり算モード:</strong> 分数の乗除を見える化しよう！'
            };

            elements.explanation.innerHTML = explanations[state.mode];

            // モードに応じてUI調整
            if (state.mode === 'addition' || state.mode === 'multiply') {
                elements.calculationArea.style.display = 'block';
                updateCalculationDisplay();
            } else {
                elements.calculationArea.style.display = 'none';
            }

            if (state.mode === 'mixed') {
                elements.numeratorSlider.max = state.denominator * 3;
            }

            updateDisplay();
        }

        // 計算表示更新
        function updateCalculationDisplay() {
            const op = state.mode === 'addition' ? '+' : '×';
            const frac1 = `<span class="fraction-small"><span>${state.numerator}</span><div class="fraction-line"></div><span>${state.denominator}</span></span>`;
            const frac2 = `<span class="fraction-small"><span>${state.fraction2.numerator}</span><div class="fraction-line"></div><span>${state.fraction2.denominator}</span></span>`;

            elements.calculationDisplay.innerHTML = `${frac1} <span class="operator">${op}</span> ${frac2} = ?`;
        }

        // 表示更新
        function updateDisplay() {
            updateSVG();
            updateEquivalentFractions();
        }

        // SVG更新
        function updateSVG() {
            const svg = elements.svg;
            svg.innerHTML = '';

            switch (state.visualType) {
                case 'pizza':
                    drawPizza(svg);
                    break;
                case 'bar':
                    drawBar(svg);
                    break;
                case 'water':
                    drawWater(svg);
                    break;
            }
        }

        // ピザ描画
        function drawPizza(svg) {
            const centerX = 200;
            const centerY = 200;
            const radius = 140;
            const slices = state.denominator;
            const filledSlices = Math.min(state.numerator, slices);

            // 背景円（お皿）
            const plate = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            plate.setAttribute('cx', centerX);
            plate.setAttribute('cy', centerY);
            plate.setAttribute('r', radius + 10);
            plate.setAttribute('fill', '#ECEFF1');
            plate.setAttribute('stroke', '#B0BEC5');
            plate.setAttribute('stroke-width', '3');
            svg.appendChild(plate);

            // ピザのスライスを描画
            for (let i = 0; i < slices; i++) {
                const startAngle = (i * 360 / slices - 90) * Math.PI / 180;
                const endAngle = ((i + 1) * 360 / slices - 90) * Math.PI / 180;

                const x1 = centerX + radius * Math.cos(startAngle);
                const y1 = centerY + radius * Math.sin(startAngle);
                const x2 = centerX + radius * Math.cos(endAngle);
                const y2 = centerY + radius * Math.sin(endAngle);

                const largeArcFlag = (360 / slices) > 180 ? 1 : 0;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const d = `M ${centerX} ${centerY} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;
                path.setAttribute('d', d);

                if (i < filledSlices) {
                    path.setAttribute('fill', '#FFA726');
                    path.setAttribute('stroke', '#FF6F00');
                } else {
                    path.setAttribute('fill', '#FFD54F');
                    path.setAttribute('stroke', '#FFA000');
                }
                path.setAttribute('stroke-width', '2');

                // アニメーション
                path.style.opacity = '0';
                path.style.transform = `scale(0)`;
                path.style.transformOrigin = `${centerX}px ${centerY}px`;
                path.style.transition = `all 0.3s ease ${i * 0.05}s`;

                svg.appendChild(path);

                // アニメーション開始
                setTimeout(() => {
                    path.style.opacity = '1';
                    path.style.transform = `scale(1)`;
                }, 10);
            }

            // 中心の円
            const center = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            center.setAttribute('cx', centerX);
            center.setAttribute('cy', centerY);
            center.setAttribute('r', '8');
            center.setAttribute('fill', '#E94B3C');
            svg.appendChild(center);
        }

        // バー描画
        function drawBar(svg) {
            const barWidth = 320;
            const barHeight = 60;
            const startX = 40;
            const startY = 170;
            const pieces = state.denominator;
            const pieceWidth = barWidth / pieces;
            const filledPieces = Math.min(state.numerator, pieces);

            // 外枠
            const border = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            border.setAttribute('x', startX - 5);
            border.setAttribute('y', startY - 5);
            border.setAttribute('width', barWidth + 10);
            border.setAttribute('height', barHeight + 10);
            border.setAttribute('fill', 'none');
            border.setAttribute('stroke', '#546E7A');
            border.setAttribute('stroke-width', '3');
            border.setAttribute('rx', '8');
            svg.appendChild(border);

            // バーのピース
            for (let i = 0; i < pieces; i++) {
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', startX + i * pieceWidth);
                rect.setAttribute('y', startY);
                rect.setAttribute('width', pieceWidth - 2);
                rect.setAttribute('height', barHeight);
                rect.setAttribute('fill', i < filledPieces ? '#7ED321' : '#E0E0E0');
                rect.setAttribute('stroke', '#FFFFFF');
                rect.setAttribute('stroke-width', '2');
                rect.setAttribute('rx', '4');

                // アニメーション
                rect.style.opacity = '0';
                rect.style.transform = `translateY(-20px)`;
                rect.style.transition = `all 0.3s ease ${i * 0.05}s`;

                svg.appendChild(rect);

                setTimeout(() => {
                    rect.style.opacity = '1';
                    rect.style.transform = `translateY(0)`;
                }, 10);
            }

            // ラベル
            const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('x', startX + barWidth / 2);
            label.setAttribute('y', startY + barHeight + 40);
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('font-size', '20');
            label.setAttribute('font-weight', 'bold');
            label.setAttribute('fill', '#4A90E2');
            label.textContent = `${state.numerator} / ${state.denominator}`;
            svg.appendChild(label);
        }

        // 水描画
        function drawWater(svg) {
            const glassX = 120;
            const glassY = 80;
            const glassWidth = 160;
            const glassHeight = 280;
            const waterLevel = state.denominator > 0 ? (state.numerator / state.denominator) : 0;
            const waterHeight = Math.min(glassHeight * waterLevel, glassHeight);

            // グラス本体
            const glass = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            glass.setAttribute('x', glassX);
            glass.setAttribute('y', glassY);
            glass.setAttribute('width', glassWidth);
            glass.setAttribute('height', glassHeight);
            glass.setAttribute('fill', 'none');
            glass.setAttribute('stroke', '#90CAF9');
            glass.setAttribute('stroke-width', '4');
            glass.setAttribute('rx', '12');
            svg.appendChild(glass);

            // 水
            const water = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            water.setAttribute('x', glassX + 4);
            water.setAttribute('y', glassY + glassHeight - waterHeight + 4);
            water.setAttribute('width', glassWidth - 8);
            water.setAttribute('height', Math.max(0, waterHeight - 8));
            water.setAttribute('fill', 'url(#waterGradient)');
            water.setAttribute('rx', '8');

            // アニメーション
            water.style.transition = 'all 0.5s ease';
            svg.appendChild(water);

            // グラデーション定義
            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
            gradient.setAttribute('id', 'waterGradient');
            gradient.setAttribute('x1', '0%');
            gradient.setAttribute('y1', '0%');
            gradient.setAttribute('x2', '0%');
            gradient.setAttribute('y2', '100%');

            const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop1.setAttribute('offset', '0%');
            stop1.setAttribute('stop-color', '#81D4FA');
            stop1.setAttribute('stop-opacity', '0.9');

            const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop2.setAttribute('offset', '100%');
            stop2.setAttribute('stop-color', '#4FC3F7');
            stop2.setAttribute('stop-opacity', '0.9');

            gradient.appendChild(stop1);
            gradient.appendChild(stop2);
            defs.appendChild(gradient);
            svg.insertBefore(defs, svg.firstChild);

            // 目盛り線
            for (let i = 0; i <= 4; i++) {
                const lineY = glassY + (glassHeight / 4) * i;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', glassX - 10);
                line.setAttribute('y1', lineY);
                line.setAttribute('x2', glassX);
                line.setAttribute('y2', lineY);
                line.setAttribute('stroke', '#607D8B');
                line.setAttribute('stroke-width', '2');
                svg.appendChild(line);
            }

            // パーセンテージ表示
            const percentage = Math.round(waterLevel * 100);
            const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('x', glassX + glassWidth / 2);
            label.setAttribute('y', glassY + glassHeight + 40);
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('font-size', '24');
            label.setAttribute('font-weight', 'bold');
            label.setAttribute('fill', '#4FC3F7');
            label.textContent = `${percentage}%`;
            svg.appendChild(label);
        }

        // 等価分数表示
        function updateEquivalentFractions() {
            if (state.denominator === 0) return;

            const gcd = findGCD(state.numerator, state.denominator);
            const simplified = {
                numerator: state.numerator / gcd,
                denominator: state.denominator / gcd
            };

            const equivalents = [];

            // 簡約形
            if (gcd > 1) {
                equivalents.push(`${simplified.numerator}/${simplified.denominator}`);
            }

            // いくつかの等価分数を生成
            for (let mult = 2; mult <= 3; mult++) {
                const num = simplified.numerator * mult;
                const den = simplified.denominator * mult;
                if (den <= 12 && !(num === state.numerator && den === state.denominator)) {
                    equivalents.push(`${num}/${den}`);
                }
            }

            elements.equivalentList.innerHTML = equivalents
                .map(frac => `<span class="equivalent-item">${frac}</span>`)
                .join('');
        }

        // 最大公約数
        function findGCD(a, b) {
            return b === 0 ? a : findGCD(b, a % b);
        }

        // 約分処理
        function handleSimplify() {
            const gcd = findGCD(state.numerator, state.denominator);

            if (gcd === 1) {
                showFeedback('この分数はもう簡単な形だよ！', 'success');
            } else {
                state.numerator = state.numerator / gcd;
                state.denominator = state.denominator / gcd;

                elements.numeratorSlider.value = state.numerator;
                elements.denominatorSlider.value = state.denominator;
                elements.numeratorValue.textContent = state.numerator;
                elements.denominatorValue.textContent = state.denominator;
                elements.displayNumerator.textContent = state.numerator;
                elements.displayDenominator.textContent = state.denominator;

                updateDisplay();
                showFeedback('約分できました！', 'success');
            }
        }

        // ランダム生成
        function generateRandom() {
            state.denominator = Math.floor(Math.random() * 11) + 2; // 2-12
            state.numerator = Math.floor(Math.random() * state.denominator) + 1; // 1-denominator

            elements.numeratorSlider.value = state.numerator;
            elements.denominatorSlider.value = state.denominator;
            elements.numeratorSlider.max = state.denominator * 2;
            elements.numeratorValue.textContent = state.numerator;
            elements.denominatorValue.textContent = state.denominator;
            elements.displayNumerator.textContent = state.numerator;
            elements.displayDenominator.textContent = state.denominator;

            updateDisplay();
        }

        // フィードバック表示
        function showFeedback(message, type) {
            elements.feedback.textContent = message;
            elements.feedback.className = `feedback show ${type}`;

            setTimeout(() => {
                elements.feedback.classList.remove('show');
            }, 3000);
        }

        // 初期化実行
        init();
    </script>
</body>
</html>
